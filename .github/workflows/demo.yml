name: Browser demo

on:
  push:
    paths:
      - "demo/**"
      - ".github/workflows/demo.yml"
  pull_request:
    paths:
      - "demo/**"
      - ".github/workflows/demo.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: demo/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
